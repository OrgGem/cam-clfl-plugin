name: Local-first CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run package:plugin
      - run: npm run smoke:package
      - uses: actions/upload-artifact@v4
        with:
          name: client-marketplace-package
          path: |
            dist/gem-cloudflare-marketplace.zip
            dist/gem-cloudflare-plugin.zip
            dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: local-browser-results
          path: test-results/

  publish-marketplace:
    name: Publish verified client marketplace
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/feat/local-first' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: publish-client-marketplace
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: marketplace
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: client-marketplace-package
          path: ${{ runner.temp }}/client-package
      - name: Verify and unpack tested artifact
        working-directory: ${{ runner.temp }}/client-package
        run: |
          sha256sum --check SHA256SUMS.txt
          mkdir unpacked
          unzip -q gem-cloudflare-marketplace.zip -d unpacked
          test -f unpacked/.agents/plugins/marketplace.json
          test -f unpacked/plugin/server/index.mjs
      - name: Skip superseded source revisions
        id: source
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          latest=$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)
          if [ "$latest" = "$SOURCE_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Source branch has moved; a newer run will publish.'
          fi
      - name: Publish marketplace branch
        if: steps.source.outputs.current == 'true'
        env:
          PACKAGE_DIR: ${{ runner.temp }}/client-package
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          rsync -a --delete --exclude=.git/ "$PACKAGE_DIR/unpacked/" ./
          mkdir -p downloads
          cp "$PACKAGE_DIR/"*.zip "$PACKAGE_DIR/SHA256SUMS.txt" downloads/
          jq -n --arg commit "$SOURCE_SHA" --arg branch "$SOURCE_BRANCH" --arg run "$RUN_URL" \
            '{source_commit:$commit,source_branch:$branch,verified_workflow:$run}' > PUBLISH.json
          cat > README.md <<'DOC'
          # Gem Cloudflare Manager — client marketplace

          Generated by GitHub Actions after source validation and isolated-package tests.
          Install with `codex plugin marketplace add OrgGem/cam-clfl-plugin --ref marketplace`.
          Requires ChatGPT desktop/local-plugin support and Node 22.12+.
          This is a Git marketplace distribution, not an approved public OpenAI Directory listing.
          See PUBLISH.json for source provenance and downloads/ for ZIPs and SHA256 checksums.
          DOC
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'Marketplace already up to date.'
            exit 0
          fi
          git commit -m "Publish verified client plugin from $SOURCE_SHA"
          git push origin HEAD:marketplace
          echo "Published marketplace from $SOURCE_SHA. This does not submit to OpenAI Directory." >> "$GITHUB_STEP_SUMMARY"
